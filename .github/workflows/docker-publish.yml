name: Publish Docker image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run check && bun run test
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        # Retain the original repository's image location.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/horadrictube" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: horadrictube:publish-test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Integration tests against the packaged CPU Vulkan stack
        run: docker run --rm --network none --mount "type=bind,src=$PWD,dst=/workspace,readonly" --workdir /workspace --entrypoint bun horadrictube:publish-test test ./test/integration
      - name: Container startup smoke test
        run: |
          docker run -d --name horadrictube-publish-test -p 5000:5000 horadrictube:publish-test
          trap 'docker logs horadrictube-publish-test; docker rm -f horadrictube-publish-test' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag horadrictube:publish-test "$tag"
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
